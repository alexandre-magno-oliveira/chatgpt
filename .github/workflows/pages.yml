name: Publicar proposta no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir -p "$RUNNER_TEMP/rota-site/plano_de_curso_rota"
          cp -R plano_de_curso_rota/. "$RUNNER_TEMP/rota-site/plano_de_curso_rota/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rota-site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
